name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only static checks run automatically — the live-site test job was removed. GitHub Actions
# runners hit my-drama.com from Azure US datacenter IPs, which trigger a US-specific CCPA
# "Opt-out Preferences" consent flow this suite doesn't handle, unrelated to any code defect
# (the same suite passes locally every time). See README's CI section. Run tests locally
# instead (`npm test`), or via `workflow_dispatch` if you specifically want to see this fail.
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
